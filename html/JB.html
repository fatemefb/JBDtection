<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JB Detection System</title>
    <link rel="stylesheet" href="JB.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>JB Detection System</h1>
            <p>PDF Tag & JB Identifier Extraction Tool</p>
        </header>

        <main>
            <section class="upload-section">
                <h2>Upload Files</h2>
                <div class="upload-container">
                    <div class="upload-box">
                        <h3>PDF Files</h3>
                        <input type="file" id="pdfInput" multiple accept=".pdf">
                        <label for="pdfInput">
                            <span class="icon">📄</span>
                            <span>Choose PDF files</span>
                        </label>
                        <div id="pdfList" class="file-list"></div>
                    </div>

                    <div class="upload-box">
                        <h3>Excel File</h3>
                        <input type="file" id="excelInput" accept=".xlsx,.xls">
                        <label for="excelInput">
                            <span class="icon">📊</span>
                            <span>Choose Excel file</span>
                        </label>
                        <div id="excelName" class="file-list"></div>
                    </div>
                </div>
            </section>

            <section class="settings-section">
                <h2>Processing Settings</h2>
                <div class="settings-container">
                    <div class="setting-item">
                        <label for="tesseractPath">Tesseract Path (Optional):</label>
                        <input type="text" id="tesseractPath" placeholder="Enter Tesseract path...">
                    </div>
                    <div class="setting-item">
                        <label for="outputPath">Output Directory:</label>
                        <input type="text" id="outputPath" placeholder="Enter output directory path...">
                    </div>
                </div>
            </section>

            <section class="process-section">
                <button id="processButton" class="process-btn">
                    Start Processing
                    <span class="icon">▶️</span>
                </button>
            </section>

            <section class="results-section">
                <h2>Processing Results</h2>
                <div class="results-container">
                    <div class="progress-box">
                        <h3>Progress</h3>
                        <div class="progress-bar">
                            <div class="progress" style="width: 0%"></div>
                        </div>
                        <p class="progress-text">0%</p>
                    </div>

                    <div class="stats-box">
                        <h3>Statistics</h3>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <span class="stat-label">Total Tags Found:</span>
                                <span class="stat-value" id="totalTags">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Total JB Identifiers:</span>
                                <span class="stat-value" id="totalJB">0</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Pages Processed:</span>
                                <span class="stat-value" id="pagesProcessed">0</span>
                            </div>
                        </div>
                    </div>

                    <div class="log-box">
                        <h3>Processing Log</h3>
                        <div id="logOutput" class="log-content"></div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 JB Detection System. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
